name: Bug report
description: Report a reproducible defect in LiquidOS or Atomic Nexus.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private keys, personal data, or live customer evidence."
  - type: input
    id: component
    attributes:
      label: Component
      description: Which subsystem is affected?
      placeholder: src/services, an_nexus, docs, etc.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      description: The exact revision where the issue occurs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands and sanitized output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Runtime versions, test results, and relevant sanitized logs.
    validations:
      required: false
