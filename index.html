    <script>
      // Ignore harmless WebSocket disconnection or closed without opened errors in iframe sandbox
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        if (msg.includes('WebSocket') || msg.includes('vite:ws') || msg.includes('without opened')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event && (event.message || '');
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('without opened') || msg.includes('vite:ws'))) {
          event.preventDefault();
        }
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
